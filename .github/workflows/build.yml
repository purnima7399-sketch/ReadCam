name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ReadCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReadCam-apk
          path: ReadCam.apk

      # Publishes the APK as a plain download on the repo's "latest" release page,
      # so it can be installed straight from a phone browser.
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ReadCam.apk \
            --title "ReadCam (latest build)" \
            --notes "Tap ReadCam.apk below to download and install on your phone." \
            --target "${{ github.sha }}"

permissions:
  contents: write
